<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js + A-Frame – Interaction</title>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      AFRAME.registerComponent('box-interactions', {
        init: function () {
          const box = this.el;

          box.addEventListener('click', () => {
            // changer couleur
            const currentColor = box.getAttribute('material').color;
            const newColor = currentColor === '#4CC3D9'
              ? '#EF2D5E'
              : '#4CC3D9';

            box.setAttribute('material', 'color', newColor);

            // changer vitesse de rotation (dur plus petit)
            const currentDur = box.getAttribute('animation').dur || 3000;
            const newDur = currentDur === 3000 ? 800 : 3000;

            box.setAttribute('animation', 'dur', newDur);
          });
        }
      });
    </script>
  </head>

  <body style="margin:0; overflow:hidden;">

    <a-scene embedded arjs="sourceType: webcam;">

      <a-marker preset="hiro">

        <a-box
          class="clickable"
          position="0 0.5 0"
          material="color: #4CC3D9; opacity: 0.5;"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"
          box-interactions>
        </a-box>

      </a-marker>

      <a-marker
        type="pattern"
        url="pattern-maker.patt">

        <a-sphere
          position="0 0.5 0"
          radius="0.5"
          color="#EF2D5E"
          animation="
            property: rotation;
            to: 0 360 0;
            loop: true;
            dur: 3000">
        </a-sphere>

      </a-marker>

      <a-entity
        camera
        cursor="fuse: false; rayOrigin: mouse"
        raycaster="objects: .clickable">
      </a-entity>

    </a-scene>

  </body>
</html>
