<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR.js + A-Frame – Interaction</title>

  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <script>
    AFRAME.registerComponent('box-interactions', {
      init: function () {

        const box = this.el;

        box.addEventListener('click', function () {

          console.log("BOÎTE CLIQUÉE !");

          // Récupérer la couleur actuelle
          const currentColor = box.getAttribute('material').color;

          // Changer la couleur
          if (currentColor === '#4CC3D9') {
            box.setAttribute('material', 'color', '#EF2D5E');
          } else {
            box.setAttribute('material', 'color', '#4CC3D9');
          }

          // Changer la vitesse de rotation
          const currentAnimation = box.getAttribute('animation__rotation');

          if (currentAnimation.dur === 3000) {
            box.setAttribute('animation__rotation', {
              property: 'rotation',
              to: '0 360 0',
              loop: true,
              dur: 800
            });
          } else {
            box.setAttribute('animation__rotation', {
              property: 'rotation',
              to: '0 360 0',
              loop: true,
              dur: 3000
            });
          }

        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded
           arjs="sourceType: webcam;">

    <a-marker preset="hiro">

      <a-box
        class="clickable"
        position="0 0.5 0"
        material="color: #4CC3D9; opacity: 0.5"

        animation__rotation="
          property: rotation;
          to: 0 360 0;
          loop: true;
          dur: 3000
        "

        box-interactions>
      </a-box>

    </a-marker>
    <a-marker
            type="pattern"
            url="pattern-maker.patt">

            <!-- Objet 3D -->
            <a-sphere
                position="0 0.5 0"
                radius="0.5"
                color="#EF2D5E">

            </a-sphere>

        </a-marker>
    <a-entity
      camera
      cursor="rayOrigin: mouse"
      raycaster="objects: .clickable">
    </a-entity>

  </a-scene>

</body>
</html>
